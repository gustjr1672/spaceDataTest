version: '3.8'

services:
  # 1. FastAPI 백엔드 컨테이너
  api:
    build: .
    container_name: observer_api
    # Nginx를 통해서만 접속하게 할 것이므로 ports(외부 개방) 대신 expose(내부망 개방) 사용
    expose:
      - "8000"

  # 2. Nginx 웹 서버 컨테이너
  nginx:
    image: nginx:latest
    container_name: observer_nginx
    ports:
      - "80:80" # 드디어 외부(브라우저)에서 포트 번호 없이 접속 가능
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api # api 컨테이너가 먼저 켜진 후 nginx가 켜지도록 설정